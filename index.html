
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RainyStar Reactive</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
      color: #f4f5ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      padding: 16px;
    }

    .avatar {
      width: min(420px, 90vw);
      height: min(600px, 75vh);
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    h1 {
      color: #a9a4ff;
      font-size: 24px;
    }

    #status {
      color: #68edc0;
    }

    button {
      margin: 5px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #7771df;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #918bff;
    }
  </style>
</head>
<body>
  <main>
    <h1>✦ RainyStar Reactive</h1>

    <div class="avatar">
      <img id="character" src="1.png" alt="Аватар RainyStar">
    </div>

    <p id="status">Сейчас молчит</p>

    <button id="silentButton">Закрытый рот</button>
    <button id="talkButton">Открытый рот</button>
  </main>

  <script>
    const character = document.getElementById('character');
    const status = document.getElementById('status');

    function setSpeaking(speaking) {
      character.src = speaking ? '2.png' : '1.png';
      status.textContent = speaking
        ? 'Говорит сейчас'
        : 'Сейчас молчит';
    }

    document.getElementById('silentButton')
      .addEventListener('click', () => setSpeaking(false));

    document.getElementById('talkButton')
      .addEventListener('click', () => setSpeaking(true));

    character.addEventListener('error', () => {
      status.textContent = 'Ошибка загрузки картинки — проверь имена PNG-файлов';
    });
  </script>
</body>
</html>
