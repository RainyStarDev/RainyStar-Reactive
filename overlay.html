
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RainyStar Reactive — Overlay</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: #f4f4f5;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    /* Аватар в обычном окне: целиком помещается в экран */
    #avatar {
      display: none;
      position: fixed;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      object-position: center bottom;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
    }

    /* В OBS оставляем аватар внутри размера Browser Source */
    body.obs-mode #avatar {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }

    #empty {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #171722dd;
      color: white;
      font-size: 12px;
    }

    body.has-avatar #empty,
    body.clean #empty {
      display: none;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding: 16px;
      border: 1px solid #414155;
      border-radius: 14px;
      background: #171722;
      box-shadow: 0 8px 30px #0008;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    p {
      margin: 8px 0;
      color: #c7c7d4;
      font-size: 13px;
      line-height: 1.4;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      margin-top: 6px;
      font-size: 12px;
    }

    button {
      margin: 5px 4px 0 0;
      padding: 9px 11px;
      border: 1px solid #50506a;
      border-radius: 8px;
      background: #29293b;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #393951;
    }

    button.danger {
      border-color: #8d414b;
      background: #49252d;
    }

    #status {
      margin-top: 12px;
      overflow-wrap: anywhere;
      color: #b8f3ce;
      font-size: 12px;
      line-height: 1.4;
    }

    body.clean #panel {
      display: none;
    }

    body.clean #empty {
      display: none;
    }
  </style>
</head>

<body>
  <img id="avatar" alt="Аватар RainyStar Reactive">
  <div id="empty">Аватар не загружен</div>

  <section id="panel">
    <h2>RainyStar Reactive</h2>
    <p>Загрузи PNG с закрытым и открытым ртом. Изображения должны быть одного размера и показывать одного персонажа.</p>

    <label>
      PNG — рот закрыт
      <input id="closedFile" type="file" accept="image/png">
    </label>

    <label>
      PNG — рот открыт
      <input id="openFile" type="file" accept="image/png">
    </label>

    <div>
      <button id="closedBtn">Рот закрыт</button>
      <button id="openBtn">Рот открыт</button>
    </div>

    <div>
      <button id="testBtn">Тест переключения</button>
      <button id="stopBtn">Стоп</button>
    </div>

    <div>
      <button id="hideButton">Скрыть панель</button>
      <button id="showButton">Показать панель</button>
    </div>

    <div>
      <button id="clearButton" class="danger">Очистить аватар</button>
    </div>

    <div id="status">Загрузи PNG, чтобы начать.</div>
  </section>

  <script>
    (() => {
      const avatar = document.getElementById('avatar');
      const status = document.getElementById('status');
      const closedFile = document.getElementById('closedFile');
      const openFile = document.getElementById('openFile');

      let closedImage = null;
      let openImage = null;
      let timer = null;
      let isOpen = false;

      const params = new URLSearchParams(location.search);

      /*
       * Добавь ?obs=1 в URL источника OBS.
       * Обычная ссылка без параметра использует масштабирование под окно.
       */
      if (params.get('obs') === '1') {
        document.body.classList.add('obs-mode');
      }

      function setStatus(message) {
        status.textContent = message;
      }

      function stopTest() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      function render() {
        const src = isOpen ? openImage : closedImage;

        if (src) {
          avatar.src = src;
          avatar.style.display = 'block';
          document.body.classList.add('has-avatar');
        } else {
          avatar.removeAttribute('src');
          avatar.style.display = 'none';
          document.body.classList.remove('has-avatar');
        }
      }

      function startTest() {
        if (!closedImage || !openImage) {
          setStatus('Сначала загрузи оба PNG.');
          return;
        }

        stopTest();
        isOpen = false;
        render();

        timer = setInterval(() => {
          isOpen = !isOpen;
          render();
        }, 500);

        setStatus('Тест работает: переключение каждые 0,5 секунды.');
      }

      function loadFile(file, type) {
        if (!file) return;

        if (file.type !== 'image/png') {
          setStatus('Нужен файл в формате PNG.');
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          setStatus('Файл больше 5 МБ. Выбери изображение поменьше.');
          return;
        }

        const reader = new FileReader();

        reader.onload = () => {
          const image = new Image();

          image.onload = () => {
            if (type === 'closed') {
              closedImage = reader.result;
            } else {
              openImage = reader.result;
            }

            try {
              localStorage.setItem(
                type === 'closed' ? 'rsr_closed_png' : 'rsr_open_png',
                reader.result
              );
            } catch (error) {
              setStatus('PNG загружен, но не удалось сохранить его в браузере.');
            }

            isOpen = false;
            render();

            if (closedImage && openImage) {
              setStatus('Оба PNG загружены. Можно запустить тест.');
            } else {
              setStatus('Изображение загружено. Теперь загрузи второе.');
            }
          };

          image.onerror = () => {
            setStatus('Не удалось прочитать изображение. Попробуй другой PNG.');
          };

          image.src = reader.result;
        };

        reader.onerror = () => setStatus('Ошибка чтения файла.');
        reader.readAsDataURL(file);
      }

      closedFile.addEventListener('change', () => {
        loadFile(closedFile.files[0], 'closed');
      });

      openFile.addEventListener('change', () => {
        loadFile(openFile.files[0], 'open');
      });

      document.getElementById('closedBtn').onclick = () => {
        stopTest();
        isOpen = false;
        render();
        setStatus(closedImage
          ? 'Показан аватар с закрытым ртом.'
          : 'Сначала загрузи PNG с закрытым ртом.');
      };

      document.getElementById('openBtn').onclick = () => {
        stopTest();

        if (!openImage) {
          setStatus('Сначала загрузи PNG с открытым ртом.');
          return;
        }

        isOpen = true;
        render();
        setStatus('Показан аватар с открытым ртом.');
      };

      document.getElementById('testBtn').onclick = startTest;

      document.getElementById('stopBtn').onclick = () => {
        stopTest();
        isOpen = false;
        render();
        setStatus('Тест остановлен.');
      };

      document.getElementById('hideButton').onclick = () => {
        document.body.classList.add('clean');
        setStatus('Панель скрыта. Тест, если он запущен, продолжится.');
      };

      document.getElementById('showButton').onclick = () => {
        document.body.classList.remove('clean');
      };

      document.getElementById('clearButton').onclick = () => {
        stopTest();
        closedImage = null;
        openImage = null;
        isOpen = false;

        try {
          localStorage.removeItem('rsr_closed_png');
          localStorage.removeItem('rsr_open_png');
        } catch (error) {
          setStatus('Не удалось очистить хранилище браузера.');
          return;
        }

        closedFile.value = '';
        openFile.value = '';
        render();
        document.body.classList.remove('clean');
        setStatus('Аватар и оба сохранённых PNG удалены из хранилища этой страницы.');
      };

      try {
        closedImage = localStorage.getItem('rsr_closed_png');
        openImage = localStorage.getItem('rsr_open_png');
      } catch (error) {
        setStatus('Браузер не разрешил прочитать сохранённые изображения.');
      }

      render();

      if (params.get('clean') === '1') {
        document.body.classList.add('clean');
      }

      if (closedImage && openImage) {
        setStatus('Сохранённые изображения восстановлены.');
      } else if (closedImage || openImage) {
        setStatus('Найден один PNG. Загрузи недостающий.');
      }
    })();
  </script>
</body>
</html>
