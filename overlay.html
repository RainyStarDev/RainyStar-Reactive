
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RainyStar Reactive — Overlay</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 100%;
      min-height: 100%;
      background: transparent;
      color: #f4f4f5;
      font-family: Arial, sans-serif;
    }

    body { overflow: hidden; }

    #avatar {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: min(340px, calc(100vw - 24px));
      padding: 16px;
      border: 1px solid #414155;
      border-radius: 14px;
      background: #171722;
      box-shadow: 0 8px 30px #0008;
    }

    h2 { margin: 0 0 12px; font-size: 18px; }
    p { margin: 8px 0; font-size: 13px; color: #c7c7d4; }
    label { display: block; margin-top: 12px; font-size: 13px; }

    input[type="file"] {
      display: block;
      width: 100%;
      margin-top: 6px;
      font-size: 12px;
    }

    button {
      margin: 5px 4px 0 0;
      padding: 9px 11px;
      border: 1px solid #50506a;
      border-radius: 8px;
      background: #29293b;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #393951; }

    #status {
      margin-top: 12px;
      overflow-wrap: anywhere;
      font-size: 12px;
      color: #b8f3ce;
    }

    body.clean #panel { display: none; }
    body.clean #avatar { width: 100vw; height: 100vh; }

    #empty {
      position: fixed;
      top: 12px;
      right: 12px;
      color: white;
      background: #171722dd;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
    }

    body.has-avatar #empty { display: none; }
    body.clean #empty { display: none; }
  </style>
</head>
<body>
  <img id="avatar" alt="Аватар RainyStar Reactive">

  <div id="empty">Сначала загрузи PNG в панели управления</div>

  <section id="panel">
    <h2>RainyStar Reactive</h2>
    <p>Загрузи два PNG одного персонажа: с закрытым и открытым ртом.</p>

    <label>
      PNG — рот закрыт
      <input id="closedFile" type="file" accept="image/png">
    </label>

    <label>
      PNG — рот открыт
      <input id="openFile" type="file" accept="image/png">
    </label>

    <div>
      <button id="closedBtn">Рот закрыт</button>
      <button id="openBtn">Рот открыт</button>
    </div>
    <div>
      <button id="testBtn">Тест переключения</button>
      <button id="stopBtn">Стоп</button>
      <button id="hideButton">Скрыть панель</button>
    </div>

    <div id="status">Ожидаю загрузки изображений.</div>
  </section>

  <script>
    (() => {
      const avatar = document.getElementById('avatar');
      const status = document.getElementById('status');
      const closedFile = document.getElementById('closedFile');
      const openFile = document.getElementById('openFile');

      let closedImage = null;
      let openImage = null;
      let timer = null;
      let isOpen = false;

      function showStatus(message) {
        status.textContent = message;
      }

      function render() {
        const src = isOpen ? openImage : closedImage;

        if (src) {
          avatar.src = src;
          document.body.classList.add('has-avatar');
        } else {
          avatar.removeAttribute('src');
          document.body.classList.remove('has-avatar');
        }
      }

      function stopTest() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      function startTest() {
        if (!closedImage || !openImage) {
          showStatus('Сначала загрузи оба PNG.');
          return;
        }

        stopTest();
        isOpen = false;
        render();

        timer = setInterval(() => {
          isOpen = !isOpen;
          render();
        }, 500);

        showStatus('Тест работает: рот переключается каждые 0,5 секунды.');
      }

      function loadFile(file, type) {
        if (!file) return;

        if (file.type !== 'image/png') {
          showStatus('Выбери файл в формате PNG.');
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          showStatus('Файл больше 5 МБ. Выбери PNG поменьше.');
          return;
        }

        const reader = new FileReader();

        reader.onload = () => {
          const image = new Image();

          image.onload = () => {
            if (type === 'closed') {
              closedImage = reader.result;
              try {
                localStorage.setItem('rsr_closed_png', closedImage);
              } catch (error) {
                showStatus('PNG загружен, но не удалось сохранить его в браузере.');
              }
            } else {
              openImage = reader.result;
              try {
                localStorage.setItem('rsr_open_png', openImage);
              } catch (error) {
                showStatus('PNG загружен, но не удалось сохранить его в браузере.');
              }
            }

            isOpen = false;
            render();

            if (closedImage && openImage) {
              showStatus('Оба PNG готовы. Можно запускать тест.');
            } else {
              showStatus('Изображение загружено. Теперь загрузи второе.');
            }
          };

          image.onerror = () => showStatus('Не удалось прочитать PNG. Попробуй другой файл.');
          image.src = reader.result;
        };

        reader.onerror = () => showStatus('Ошибка чтения файла.');
        reader.readAsDataURL(file);
      }

      closedFile.addEventListener('change', () => {
        loadFile(closedFile.files[0], 'closed');
      });

      openFile.addEventListener('change', () => {
        loadFile(openFile.files[0], 'open');
      });

      document.getElementById('closedBtn').onclick = () => {
        stopTest();
        isOpen = false;
        render();
        showStatus(closedImage ? 'Показан PNG с закрытым ртом.' : 'Сначала загрузи PNG с закрытым ртом.');
      };

      document.getElementById('openBtn').onclick = () => {
        stopTest();
        if (!openImage) {
          showStatus('Сначала загрузи PNG с открытым ртом.');
          return;
        }
        isOpen = true;
        render();
        showStatus('Показан PNG с открытым ртом.');
      };

      document.getElementById('testBtn').onclick = startTest;

      document.getElementById('stopBtn').onclick = () => {
        stopTest();
        isOpen = false;
        render();
        showStatus('Тест остановлен.');
      };

      document.getElementById('hideButton').onclick = () => {
        document.body.classList.add('clean');
      };

      try {
        closedImage = localStorage.getItem('rsr_closed_png');
        openImage = localStorage.getItem('rsr_open_png');
      } catch (error) {
        showStatus('Браузер запретил доступ к сохранённым изображениям.');
      }

      render();

      if (new URLSearchParams(location.search).get('clean') === '1') {
        document.body.classList.add('clean');
      }

      if (closedImage && openImage) {
        showStatus('Изображения восстановлены из хранилища браузера.');
      }
    })();
  </script>
</body>
</html>
